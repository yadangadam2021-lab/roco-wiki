<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>洛克广场 - 洛克王国：世界 Wiki攻略站</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--p:#FF6B35;--pl:#FF8F5E;--pd:#E5531F;--bg:#FFF8F0;--card:#FFF;--sec:#FFF3E8;--t:#2D2D2D;--tl:#888;--tm:#AAA;--bd:#F0E6DC;--sh:0 2px 12px rgba(255,107,53,.08);--r:16px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.hero{background:linear-gradient(135deg,#FF6B35,#FF8F5E,#FFB347);position:relative;overflow:hidden}
.hero-inner{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:44px 24px 36px;text-align:center}
.hero-badge{display:inline-block;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);padding:5px 14px;border-radius:20px;font-size:13px;color:#fff;margin-bottom:12px}
.hero h1{font-size:32px;font-weight:900;color:#fff}
.hero h1 span{display:block;font-size:14px;font-weight:400;opacity:.9;margin-top:6px;letter-spacing:2px}
.nav-wrap{background:#fff;position:sticky;top:0;z-index:100;border-bottom:1px solid var(--bd);box-shadow:0 1px 6px rgba(0,0,0,.04)}
.nav-inner{max-width:1200px;margin:0 auto;display:flex;gap:4px;padding:0 24px;overflow-x:auto}
.nav-tab{padding:13px 18px;font-size:14px;font-weight:500;color:var(--tl);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;transition:.25s}
.nav-tab:hover{color:var(--p)}.nav-tab.active{color:var(--p);border-bottom-color:var(--p);font-weight:700}
.search-wrap{max-width:1200px;margin:0 auto;padding:20px 24px 8px}
.search-box{display:flex;align-items:center;background:#fff;border:2px solid var(--bd);border-radius:14px;padding:0 16px;transition:.3s;box-shadow:var(--sh)}
.search-box:focus-within{border-color:var(--p);box-shadow:0 0 0 4px rgba(255,107,53,.1)}
.search-box input{flex:1;border:none;outline:none;padding:12px 10px;font-size:15px;background:transparent;font-family:inherit}
.main{max-width:1200px;margin:0 auto;padding:12px 24px 60px}
.stats-row{display:flex;gap:10px;margin-bottom:24px;overflow-x:auto}
.stat-card{flex:1;min-width:120px;background:#fff;border-radius:12px;padding:16px;box-shadow:var(--sh);border:1px solid var(--bd);text-align:center}
.stat-num{font-size:26px;font-weight:900;background:linear-gradient(135deg,var(--p),var(--pl));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.stat-label{font-size:12px;color:var(--tm);margin-top:2px}
.section{margin-bottom:24px}
.section-card{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);border:1px solid var(--bd)}
.section-header{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.section-icon{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px}
.section-icon.tj{background:linear-gradient(135deg,#FFE0CC,#FFCBA4)}
.section-icon.tl{background:linear-gradient(135deg,#D0E8FF,#A8D4FF)}
.section-icon.wk{background:linear-gradient(135deg,#E8D5F5,#D4B8EA)}
.section-title{font-size:17px;font-weight:700}
.section-title small{font-size:11px;font-weight:400;color:var(--tm);margin-left:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
@media(min-width:768px){.grid{grid-template-columns:repeat(6,1fr)}}
.grid-item{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px 10px;border-radius:12px;cursor:pointer;transition:.3s;position:relative}
.grid-item:hover{background:var(--sec);transform:translateY(-3px);box-shadow:0 6px 20px rgba(255,107,53,.12)}
.item-icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;transition:.3s}
.grid-item:hover .item-icon{transform:scale(1.1)}
.item-icon.or{background:linear-gradient(135deg,#FFF0E5,#FFE0CC)}
.item-icon.bl{background:linear-gradient(135deg,#E8F2FF,#D0E4FF)}
.item-icon.gn{background:linear-gradient(135deg,#E5F8ED,#C8F0D8)}
.item-icon.pp{background:linear-gradient(135deg,#F0E8F8,#E0D0F0)}
.item-icon.pk{background:linear-gradient(135deg,#FFE8EE,#FFD0DD)}
.item-icon.yw{background:linear-gradient(135deg,#FFF8E0,#FFF0C0)}
.item-icon.tl2{background:linear-gradient(135deg,#E0F5F0,#C0EBE0)}
.item-icon.rd{background:linear-gradient(135deg,#FFE5E5,#FFD0D0)}
.item-label{font-size:12px;font-weight:500;text-align:center}
.badge{position:absolute;top:4px;right:4px;font-size:10px;padding:1px 5px;border-radius:6px;font-weight:700;color:#fff}
.badge.hot{background:linear-gradient(135deg,#FF4B4B,#FF6B6B)}
.badge.new{background:linear-gradient(135deg,#4CAF50,#66BB6A)}
.panel-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);z-index:200}
.panel-overlay.show{display:block}
.panel{position:fixed;top:0;right:-100%;width:min(90vw,700px);height:100vh;background:#fff;z-index:201;transition:right .35s cubic-bezier(.4,0,.2,1);overflow-y:auto;box-shadow:-4px 0 30px rgba(0,0,0,.1)}
.panel.show{right:0}
.panel-head{position:sticky;top:0;background:#fff;padding:20px 24px 12px;border-bottom:1px solid var(--bd);z-index:2;display:flex;justify-content:space-between;align-items:center}
.panel-title{font-size:20px;font-weight:700}
.panel-close{width:36px;height:36px;border-radius:50%;border:none;background:#f5f5f5;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.panel-close:hover{background:#eee}
.panel-body{padding:20px 24px 40px}
.data-table{width:100%;border-collapse:collapse;font-size:13px}
.data-table th{background:#f8f4f0;padding:10px 8px;text-align:left;font-weight:600;position:sticky;top:0;cursor:pointer;white-space:nowrap;border-bottom:2px solid var(--bd)}
.data-table td{padding:8px;border-bottom:1px solid #f0f0f0;white-space:nowrap}
.data-table tr:hover td{background:#fef8f4}
.type-badge{display:inline-block;padding:2px 8px;border-radius:10px;color:#fff;font-size:11px;font-weight:600}
.rarity-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;color:#fff}
.stat-bar{display:inline-block;height:8px;border-radius:4px;min-width:4px;vertical-align:middle;margin-left:4px}
.matchup-wrap{overflow-x:auto}
.matchup-table{border-collapse:collapse;font-size:12px;min-width:600px}
.matchup-table th,.matchup-table td{width:42px;min-width:42px;height:36px;text-align:center;border:1px solid #eee;font-weight:600}
.matchup-table th{background:#f8f4f0;position:sticky;top:0;z-index:1}
.matchup-table .rh{position:sticky;left:0;background:#f8f4f0;z-index:2}
.ms{background:#4CAF50;color:#fff}.mw{background:#e57373;color:#fff}.mi{background:#424242;color:#fff}
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.filter-bar input{flex:1;min-width:120px}
.filter-bar select:focus,.filter-bar input:focus{outline:none;border-color:var(--p)}
.calc-input{width:65px;padding:6px;border:1px solid var(--bd);border-radius:8px;font-size:13px;text-align:center;font-family:inherit}
.calc-input:focus{outline:none;border-color:var(--p)}
.calc-result{font-weight:700;color:var(--p);min-width:45px;text-align:center;font-size:15px}
.calc-bar{flex:1;height:10px;background:#f0f0f0;border-radius:5px;min-width:50px;overflow:hidden}
.calc-bar-fill{height:100%;border-radius:5px;transition:width .4s}
.calc-select{padding:8px 12px;border:1px solid var(--bd);border-radius:8px;font-size:13px;font-family:inherit;background:#fff}
.nature-table{width:100%;border-collapse:collapse;font-size:13px}
.nature-table th{background:#f8f4f0;padding:10px 12px;text-align:center;font-weight:600;border-bottom:2px solid var(--bd)}
.nature-table td{padding:8px 12px;text-align:center;border-bottom:1px solid #f0f0f0}
.nature-table tr:hover td{background:#fef8f4}
.plus{color:#4CAF50;font-weight:700}.minus{color:#e57373;font-weight:700}
.footer{text-align:center;padding:28px 24px 44px;color:var(--tm);font-size:12px;line-height:1.8}
@media(max-width:480px){.hero h1{font-size:26px}.main{padding:10px 14px 48px}.section-card{padding:14px}.grid{grid-template-columns:repeat(3,1fr);gap:6px}.item-icon{width:40px;height:40px;font-size:20px}.panel{width:100vw}}
</style>
</head>
<body>
<header class="hero"><div class="hero-inner">
<div class="hero-badge">⚡ 洛克王国：世界 · 攻略百科</div>
<h1>🏰 洛克广场<span>Wiki 攻略站 · 精灵图鉴 · 数据工具</span></h1>
</div></header>
<nav class="nav-wrap"><div class="nav-inner">
<div class="nav-tab active" data-t="all">🏠 全部</div>
<div class="nav-tab" data-t="tj">📖 图鉴</div>
<div class="nav-tab" data-t="tl">🔧 工具</div>
<div class="nav-tab" data-t="wk">📚 百科</div>
</div></nav>
<div class="search-wrap"><div class="search-box"><span>🔍</span><input type="text" id="searchInput" placeholder="搜索精灵、技能、道具…"></div></div>
<main class="main">
<div class="stats-row">
<div class="stat-card"><div class="stat-num">800+</div><div class="stat-label">精灵收录</div></div>
<div class="stat-card"><div class="stat-num">500+</div><div class="stat-label">技能数据</div></div>
<div class="stat-card"><div class="stat-num">300+</div><div class="stat-label">道具信息</div></div>
<div class="stat-card"><div class="stat-num">21</div><div class="stat-label">属性系别</div></div>
</div>
<section class="section" data-s="tj"><div class="section-card">
<div class="section-header"><div class="section-icon tj">📖</div><div class="section-title">图鉴 <small>Pokédex</small></div></div>
<div class="grid">
<div class="grid-item" onclick="openPanel('spirits')"><span class="badge hot">热</span><div class="item-icon or">🐾</div><div class="item-label">精灵</div></div>
<div class="grid-item" onclick="openPanel('skills')"><div class="item-icon bl">⚔️</div><div class="item-label">技能</div></div>
<div class="grid-item" onclick="openPanel('items')"><div class="item-icon gn">🎒</div><div class="item-label">道具</div></div>
</div></div></section>
<section class="section" data-s="tl"><div class="section-card">
<div class="section-header"><div class="section-icon tl">🔧</div><div class="section-title">工具 <small>Tools</small></div></div>
<div class="grid">
<div class="grid-item" onclick="openPanel('egg')"><div class="item-icon pk">🥚</div><div class="item-label">孵蛋查询</div></div>
<div class="grid-item" onclick="openPanel('map')"><div class="item-icon tl2">🗺️</div><div class="item-label">地图工具</div></div>
<div class="grid-item" onclick="openPanel('team')"><span class="badge new">新</span><div class="item-icon pp">👥</div><div class="item-label">阵容分享</div></div>
<div class="grid-item" onclick="openPanel('train')"><div class="item-icon yw">📝</div><div class="item-label">培养分享</div></div>
<div class="grid-item" onclick="openPanel('fav')"><div class="item-icon rd">❤️</div><div class="item-label">最爱精灵</div></div>
<div class="grid-item" onclick="openPanel('calc')"><span class="badge hot">热</span><div class="item-icon bl">🧮</div><div class="item-label">能力计算</div></div>
</div></div></section>
<section class="section" data-s="wk"><div class="section-card">
<div class="section-header"><div class="section-icon wk">📚</div><div class="section-title">百科 <small>Wiki</small></div></div>
<div class="grid">
<div class="grid-item" onclick="openPanel('ability')"><div class="item-icon or">⭐</div><div class="item-label">精灵特性</div></div>
<div class="grid-item" onclick="openPanel('classify')"><div class="item-icon bl">📂</div><div class="item-label">精灵分类</div></div>
<div class="grid-item" onclick="openPanel('terms')"><div class="item-icon pp">💬</div><div class="item-label">技能名词</div></div>
<div class="grid-item" onclick="openPanel('matchup')"><span class="badge hot">热</span><div class="item-icon gn">🔄</div><div class="item-label">属性克制</div></div>
<div class="grid-item" onclick="openPanel('nature')"><div class="item-icon yw">😊</div><div class="item-label">性格修正</div></div>
</div></div></section>
</main>
<div class="panel-overlay" id="overlay" onclick="closePanel()"></div>
<div class="panel" id="panel">
<div class="panel-head"><div class="panel-title" id="panelTitle"></div><button class="panel-close" onclick="closePanel()">✕</button></div>
<div class="panel-body" id="panelBody"></div>
</div>
<footer class="footer">
<p>🏰 洛克广场 · 洛克王国：世界 Wiki攻略站</p>
<p>数据来源于B站Wiki · 仅供参考</p>
</footer>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
